name: ci
on: [push, pull_request]
jobs:
  check:
    # Windows is the shipped platform (file locking, process trees and paths differ there); Linux catches path assumptions
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
