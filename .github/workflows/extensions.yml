name: extensions
# The browser extension for Chromium browsers (Chrome, Edge, Brave, Opera, Vivaldi, Arc), Firefox and Safari. Unsigned test builds.
on: [push, pull_request]
jobs:
  extensions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ext:build
      - run: npm run ext:lint
      - name: Safari app and extension (Xcode, no code signing)
        run: npm run ext:safari
      - run: npm run ext:dist
      - uses: actions/upload-artifact@v4
        with: { name: oakqueill-extension, path: 'apps/browser/release/*.zip', if-no-files-found: error }
